[project]
name = "mlb-strikezone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christopher Chadirdjian", email = "cchadirdjian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pybaseball>=2.2.7",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
mlb-strikezone = "mlb_strikezone:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
